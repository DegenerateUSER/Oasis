name: Release Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Compile on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: oasis-linux-amd64
          - os: macos-latest
            artifact_name: oasis-darwin-arm64
          - os: windows-latest
            artifact_name: oasis-windows-amd64.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka
          pip install .

      - name: Compile with Nuitka
        run: |
          python -m nuitka --standalone --onefile --include-package=tfmutate src/tfmutate/cli.py -o ${{ matrix.artifact_name }}
        env:
          PYTHONPATH: src

      - name: Tar/Zip Release Asset
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            compress-archive -Path ${{ matrix.artifact_name }} -DestinationPath oasis-windows-amd64.zip
          else
            tar -czf ${{ matrix.artifact_name }}.tar.gz ${{ matrix.artifact_name }}
          fi

      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            oasis-*.tar.gz
            oasis-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
