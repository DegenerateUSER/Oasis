name: Release Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Compile on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: oasis-linux-amd64
          - os: macos-latest
            artifact_name: oasis-darwin-arm64
          - os: windows-latest
            artifact_name: oasis-windows-amd64.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka python-hcl2

      - name: Compile with Nuitka
        shell: bash
        run: |
          python -m nuitka \
            --standalone \
            --onefile \
            --include-package=tfmutate \
            --include-data-dir=src/tfmutate/gui/static=tfmutate/gui/static \
            --assume-yes-for-downloads \
            --python-flag=no_site \
            src/entrypoint.py \
            -o ${{ matrix.artifact_name }}
        env:
          PYTHONPATH: ${{ github.workspace }}/src

      # ── macOS: native .pkg installer ──────────────────────────────────────
      - name: Build macOS Installer Package (.pkg)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          mkdir -p pkg-staging/usr/local/bin
          cp ${{ matrix.artifact_name }} pkg-staging/usr/local/bin/oasis
          chmod +x pkg-staging/usr/local/bin/oasis
          pkgbuild \
            --identifier com.degenerateuser.oasis \
            --version "$VERSION" \
            --install-location / \
            --root pkg-staging \
            oasis-macos-arm64.pkg

      # ── Linux: native .deb installer ──────────────────────────────────────
      - name: Build Debian Package (.deb)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          mkdir -p deb-staging/DEBIAN
          mkdir -p deb-staging/usr/local/bin
          cp ${{ matrix.artifact_name }} deb-staging/usr/local/bin/oasis
          chmod +x deb-staging/usr/local/bin/oasis
          cat > deb-staging/DEBIAN/control << EOF
          Package: oasis
          Version: $VERSION
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Tushar Teotia
          Description: Oasis - IaC Mutation Testing Framework
           A mutation testing framework for Terraform IaC test suites.
          EOF
          dpkg-deb --build deb-staging oasis-linux-amd64.deb

      # ── Raw binary tarball (macOS + Linux fallback / curl installer) ──────
      - name: Package Raw Binary Tarball (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: tar -czf ${{ matrix.artifact_name }}.tar.gz ${{ matrix.artifact_name }}

      # ── Windows: zip archive ──────────────────────────────────────────────
      - name: Package Release Asset (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path ${{ matrix.artifact_name }} -DestinationPath oasis-windows-amd64.zip

      # ── Upload everything to the GitHub Release ───────────────────────────
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            oasis-*.tar.gz
            oasis-*.zip
            oasis-*.pkg
            oasis-*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
