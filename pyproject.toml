[project]
name = "oasis-tfmutate"
version = "0.1.0"
description = "Mutation testing for Terraform (Infrastructure-as-Code) test suites."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Read-only HCL parsing, used only to locate mutation targets (never to rewrite files).
    "python-hcl2>=4.3.0",
]

[project.scripts]
tfmutate = "tfmutate.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tfmutate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
