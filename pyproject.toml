[project]
name = "oasis-tfmutate"
version = "0.1.0"
description = "Mutation testing for Terraform (Infrastructure-as-Code) test suites."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Read-only scope/override and assertion parsing; the lockfile pins the tested grammar.
    "python-hcl2>=4.3.0",
]

[project.scripts]
oasis = "tfmutate.cli:main"
tfmutate = "tfmutate.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tfmutate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
